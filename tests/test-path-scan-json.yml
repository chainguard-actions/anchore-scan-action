name: Test path scan with JSON output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a simple test directory to scan
        run: |
          mkdir -p /tmp/scan-target-json
          cat > /tmp/scan-target-json/package.json << 'EOF'
          {
            "name": "test-app",
            "version": "1.0.0",
            "dependencies": {}
          }
          EOF

      - id: scan
        uses: .
        with:
          path: /tmp/scan-target-json
          output-format: json
          fail-build: "false"
          severity-cutoff: critical
        continue-on-error: true

      - name: Assert scan ran and produced JSON output
        env:
          OUTCOME: ${{ steps.scan.outcome }}
          JSON_OUT: ${{ steps.scan.outputs.json }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json output path: $JSON_OUT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$JSON_OUT" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi
            if [ ! -f "$JSON_OUT" ]; then
              echo "FAIL: json output file does not exist at: $JSON_OUT"
              exit 1
            fi
            # Verify it's valid JSON
            if ! python3 -c "import json, sys; json.load(open('$JSON_OUT'))" 2>/dev/null; then
              echo "FAIL: output file is not valid JSON"
              exit 1
            fi
            echo "PASS: valid JSON output file exists at $JSON_OUT"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (may be expected in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
