name: Test mutually exclusive inputs fail gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          image: "alpine:latest"
          path: "."
          fail-build: "false"
          output-format: "sarif"
        continue-on-error: true

      - name: Assert action fails when both image and path are specified
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when both image and path are specified"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed with mutually exclusive inputs but succeeded"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
