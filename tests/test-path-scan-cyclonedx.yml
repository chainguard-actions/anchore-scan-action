name: Test path scan with CycloneDX output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a simple test directory to scan
        run: |
          mkdir -p /tmp/scan-target-cdx
          cat > /tmp/scan-target-cdx/package.json << 'EOF'
          {
            "name": "test-app",
            "version": "1.0.0",
            "dependencies": {}
          }
          EOF

      - id: scan
        uses: .
        with:
          path: /tmp/scan-target-cdx
          output-format: cyclonedx
          fail-build: "false"
          severity-cutoff: critical
        continue-on-error: true

      - name: Assert scan ran and produced CycloneDX output
        env:
          OUTCOME: ${{ steps.scan.outcome }}
          CDX_OUT: ${{ steps.scan.outputs.cyclonedx-xml }}
        run: |
          echo "outcome: $OUTCOME"
          echo "cyclonedx-xml output path: $CDX_OUT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CDX_OUT" ]; then
              echo "FAIL: action succeeded but cyclonedx-xml output is empty"
              exit 1
            fi
            if [ ! -f "$CDX_OUT" ]; then
              echo "FAIL: cyclonedx-xml output file does not exist at: $CDX_OUT"
              exit 1
            fi
            echo "PASS: cyclonedx-xml output file exists at $CDX_OUT"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (may be expected in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
