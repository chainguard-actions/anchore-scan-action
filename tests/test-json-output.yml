name: Test JSON output format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          path: "."
          fail-build: "false"
          output-format: "json"
          severity-cutoff: "critical"
        continue-on-error: true

      - name: Assert json output path is set and file exists
        env:
          JSON_OUT: ${{ steps.action.outputs.json }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json output: $JSON_OUT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$JSON_OUT" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi
            if [ ! -f "$JSON_OUT" ]; then
              echo "FAIL: json output file does not exist at: $JSON_OUT"
              exit 1
            fi
            # Verify the file is valid JSON
            if ! python3 -c "import json, sys; json.load(open('$JSON_OUT'))" 2>/dev/null; then
              echo "FAIL: output file is not valid JSON"
              exit 1
            fi
            echo "PASS: json output file exists and is valid JSON at $JSON_OUT"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (possibly network/grype download issue in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
