name: Test JSON output format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: scan
        uses: .
        with:
          path: "."
          fail-build: "false"
          severity-cutoff: "critical"
          output-format: "json"
        continue-on-error: true
      - name: Assert scan produced JSON output
        env:
          OUTCOME: ${{ steps.scan.outcome }}
          JSON_OUT: ${{ steps.scan.outputs.json }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json output path: $JSON_OUT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$JSON_OUT" ]; then
              echo "FAIL: scan succeeded but json output path is empty"
              exit 1
            fi
            if [ ! -f "$JSON_OUT" ]; then
              echo "FAIL: json file does not exist at $JSON_OUT"
              exit 1
            fi
            # Validate it is valid JSON
            if ! python3 -c "import json,sys; json.load(open('$JSON_OUT'))" 2>/dev/null; then
              echo "FAIL: output file is not valid JSON"
              exit 1
            fi
            echo "PASS: valid JSON file found at $JSON_OUT"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: scan step failed gracefully (acceptable in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
