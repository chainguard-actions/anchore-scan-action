name: Test config input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal path and grype config file
        run: |
          mkdir -p /tmp/scan-target
          echo "FROM scratch" > /tmp/scan-target/Dockerfile
          cat > /tmp/grype-config.yaml << 'EOF'
          output: json
          fail-on-severity: critical
          ignore:
            - vulnerability: CVE-0000-0000
          EOF
      - id: action
        uses: .
        with:
          path: /tmp/scan-target
          config: /tmp/grype-config.yaml
          output-format: json
          fail-build: "false"
          severity-cutoff: critical
        continue-on-error: true
      - name: Assert action ran with config input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          JSON_OUT: ${{ steps.action.outputs.json }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json output: $JSON_OUT"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with config input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (may fail on sentinel repo or network) but config input was accepted"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
