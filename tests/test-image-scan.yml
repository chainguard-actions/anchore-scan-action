name: Test image scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          image: "alpine:3.18"
          fail-build: "false"
          output-format: "sarif"
          severity-cutoff: "critical"
        continue-on-error: true

      - name: Assert action ran and produced sarif output
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SARIF_OUT: ${{ steps.action.outputs.sarif }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sarif output: $SARIF_OUT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$SARIF_OUT" ]; then
              echo "FAIL: action succeeded but sarif output is empty"
              exit 1
            fi
            if [ ! -f "$SARIF_OUT" ]; then
              echo "FAIL: sarif output file does not exist at $SARIF_OUT"
              exit 1
            fi
            echo "PASS: sarif output file found at $SARIF_OUT"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (network/registry issue acceptable in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
