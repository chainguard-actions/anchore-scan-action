name: Test image scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: scan
        uses: .
        with:
          image: "alpine:3.18"
          fail-build: "false"
          severity-cutoff: "critical"
          output-format: "sarif"
        continue-on-error: true
      - name: Assert image scan ran and produced sarif output
        env:
          OUTCOME: ${{ steps.scan.outcome }}
          SARIF: ${{ steps.scan.outputs.sarif }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sarif output path: $SARIF"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$SARIF" ]; then
              echo "FAIL: scan succeeded but sarif output path is empty"
              exit 1
            fi
            if [ ! -f "$SARIF" ]; then
              echo "FAIL: sarif file does not exist at $SARIF"
              exit 1
            fi
            echo "PASS: sarif file found at $SARIF"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: scan step failed gracefully (acceptable in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
