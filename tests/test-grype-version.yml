name: Test grype-version input (specific Grype version)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          path: "."
          fail-build: "false"
          output-format: "json"
          severity-cutoff: "critical"
          grype-version: "v0.74.7"
        continue-on-error: true

      - name: Assert action ran with specific grype version
        env:
          JSON_OUT: ${{ steps.action.outputs.json }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json output: $JSON_OUT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$JSON_OUT" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi
            if [ ! -f "$JSON_OUT" ]; then
              echo "FAIL: json output file does not exist at: $JSON_OUT"
              exit 1
            fi
            echo "PASS: scan completed with specific grype version, output at $JSON_OUT"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (possibly network/grype download issue in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
