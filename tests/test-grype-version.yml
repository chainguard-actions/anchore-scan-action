name: Test grype-version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: "."
          fail-build: "false"
          output-format: "json"
          severity-cutoff: "critical"
          grype-version: "v0.74.0"
        continue-on-error: true
      - name: Assert action ran with grype-version input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          JSON_OUT: ${{ steps.action.outputs.json }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json output: $JSON_OUT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$JSON_OUT" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with grype-version pinned, json output: $JSON_OUT"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with grype-version input (may fail due to network/environment constraints)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
