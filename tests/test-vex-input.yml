name: Test vex input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal path and VEX document
        run: |
          mkdir -p /tmp/scan-target
          echo "FROM scratch" > /tmp/scan-target/Dockerfile
          cat > /tmp/vex-document.json << 'EOF'
          {
            "@context": "https://openvex.dev/ns/v0.2.0",
            "@id": "https://example.com/vex/test",
            "author": "Test Author",
            "timestamp": "2024-01-01T00:00:00Z",
            "version": 1,
            "statements": []
          }
          EOF
      - id: action
        uses: .
        with:
          path: /tmp/scan-target
          vex: /tmp/vex-document.json
          output-format: json
          fail-build: "false"
          severity-cutoff: critical
        continue-on-error: true
      - name: Assert action ran with vex input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          JSON_OUT: ${{ steps.action.outputs.json }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json output: $JSON_OUT"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with vex input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (may fail on sentinel repo or network) but vex input was accepted"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
