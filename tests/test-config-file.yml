name: Test config input (custom Grype config file)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal Grype config file
        run: |
          cat > /tmp/grype-test-config.yaml << 'EOF'
          output: "json"
          fail-on-severity: ""
          quiet: false
          check-for-app-update: false
          ignore: []
          EOF
          echo "Grype config file created at /tmp/grype-test-config.yaml"

      - id: action
        uses: .
        with:
          path: "."
          fail-build: "false"
          output-format: "json"
          severity-cutoff: "critical"
          config: "/tmp/grype-test-config.yaml"
        continue-on-error: true

      - name: Assert action ran with custom config
        env:
          JSON_OUT: ${{ steps.action.outputs.json }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json output: $JSON_OUT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$JSON_OUT" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi
            if [ ! -f "$JSON_OUT" ]; then
              echo "FAIL: json output file does not exist at: $JSON_OUT"
              exit 1
            fi
            echo "PASS: scan completed with custom config, output at $JSON_OUT"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (possibly network/grype download issue in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
