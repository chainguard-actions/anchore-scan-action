name: Test output file option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: "."
          fail-build: "false"
          output-format: "sarif"
          output-file: "/tmp/grype-results.sarif"
          severity-cutoff: "critical"
        continue-on-error: true
      - name: Assert output file was created
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SARIF: ${{ steps.action.outputs.sarif }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sarif output path: $SARIF"
          if [ "$OUTCOME" = "success" ]; then
            # Check the specified output file exists
            if [ ! -f "/tmp/grype-results.sarif" ]; then
              echo "FAIL: specified output file /tmp/grype-results.sarif was not created"
              exit 1
            fi
            echo "PASS: output file found at /tmp/grype-results.sarif"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (acceptable in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
