name: Test output-file option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: scan
        uses: .
        with:
          path: "."
          fail-build: "false"
          severity-cutoff: "critical"
          output-format: "sarif"
          output-file: "/tmp/custom-scan-results.sarif"
        continue-on-error: true
      - name: Assert scan wrote to the specified output file
        env:
          OUTCOME: ${{ steps.scan.outcome }}
          SARIF: ${{ steps.scan.outputs.sarif }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sarif output path: $SARIF"
          if [ "$OUTCOME" = "success" ]; then
            # The output-file should exist at the specified path
            if [ ! -f "/tmp/custom-scan-results.sarif" ]; then
              echo "FAIL: expected output file /tmp/custom-scan-results.sarif not found"
              exit 1
            fi
            echo "PASS: output file found at /tmp/custom-scan-results.sarif"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: scan step failed gracefully (acceptable in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
