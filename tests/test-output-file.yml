name: Test custom output file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          path: "."
          fail-build: "false"
          output-format: "json"
          output-file: "/tmp/grype-custom-output.json"
          severity-cutoff: "critical"
        continue-on-error: true

      - name: Assert output written to custom file
        env:
          JSON_OUT: ${{ steps.action.outputs.json }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json output: $JSON_OUT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$JSON_OUT" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi
            if [ "$JSON_OUT" != "/tmp/grype-custom-output.json" ]; then
              echo "FAIL: expected output file '/tmp/grype-custom-output.json' but got '$JSON_OUT'"
              exit 1
            fi
            if [ ! -f "/tmp/grype-custom-output.json" ]; then
              echo "FAIL: custom output file does not exist"
              exit 1
            fi
            echo "PASS: output written to custom file at $JSON_OUT"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (possibly network/grype download issue in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
