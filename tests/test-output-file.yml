name: Test custom output file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          path: "."
          fail-build: "false"
          output-format: "sarif"
          output-file: "/tmp/custom-scan-results.sarif"
          severity-cutoff: "critical"
        continue-on-error: true

      - name: Assert custom output file was created
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SARIF_OUT: ${{ steps.action.outputs.sarif }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sarif output: $SARIF_OUT"
          if [ "$OUTCOME" = "success" ]; then
            # Check the custom output file exists
            if [ ! -f "/tmp/custom-scan-results.sarif" ]; then
              echo "FAIL: custom output file /tmp/custom-scan-results.sarif was not created"
              exit 1
            fi
            echo "PASS: custom output file was created"
            # Also verify the sarif output references the file
            if [ -z "$SARIF_OUT" ]; then
              echo "WARN: sarif output variable is empty but file exists"
            else
              echo "INFO: sarif output path: $SARIF_OUT"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (acceptable in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
