name: Test table output format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          path: "."
          fail-build: "false"
          output-format: "table"
          severity-cutoff: "critical"
        continue-on-error: true

      - name: Assert table output path is set and file exists
        env:
          TABLE_OUT: ${{ steps.action.outputs.table }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "table output: $TABLE_OUT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$TABLE_OUT" ]; then
              echo "FAIL: action succeeded but table output is empty"
              exit 1
            fi
            if [ ! -f "$TABLE_OUT" ]; then
              echo "FAIL: table output file does not exist at: $TABLE_OUT"
              exit 1
            fi
            echo "PASS: table output file exists at $TABLE_OUT"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (possibly network/grype download issue in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
