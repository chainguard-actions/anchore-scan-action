name: Test cache-db input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: "."
          fail-build: "false"
          output-format: "json"
          severity-cutoff: "critical"
          cache-db: "true"
        continue-on-error: true
      - name: Assert action ran with cache-db enabled
        env:
          OUTCOME: ${{ steps.action.outcome }}
          JSON_OUT: ${{ steps.action.outputs.json }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json output: $JSON_OUT"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with cache-db enabled"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (network/cache issue acceptable in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
