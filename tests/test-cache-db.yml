name: Test cache-db input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          path: "."
          output-format: "sarif"
          fail-build: "false"
          severity-cutoff: "critical"
          cache-db: "true"

      - name: Assert sarif output is set
        env:
          SARIF_PATH: ${{ steps.action.outputs.sarif }}
        run: |
          echo "sarif output path: $SARIF_PATH"
          if [ -z "$SARIF_PATH" ]; then
            echo "FAIL: sarif output is empty"
            exit 1
          fi
          echo "PASS: sarif output is set to '$SARIF_PATH'"

      - name: Assert sarif file exists and is valid JSON
        env:
          SARIF_PATH: ${{ steps.action.outputs.sarif }}
        run: |
          echo "Checking sarif file at: $SARIF_PATH"
          if [ ! -f "$SARIF_PATH" ]; then
            echo "FAIL: sarif file does not exist at '$SARIF_PATH'"
            exit 1
          fi
          echo "File exists. Checking it is valid JSON..."
          if ! python3 -c "import json,sys; json.load(open('$SARIF_PATH'))" 2>/dev/null; then
            echo "FAIL: sarif file is not valid JSON"
            exit 1
          fi
          echo "PASS: sarif file exists and is valid JSON"
