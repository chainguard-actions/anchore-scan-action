name: Test cache-db input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: "."
          fail-build: "false"
          output-format: "sarif"
          severity-cutoff: "critical"
          cache-db: "true"
        continue-on-error: true
      - name: Assert action ran with cache-db enabled
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SARIF: ${{ steps.action.outputs.sarif }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sarif output: $SARIF"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$SARIF" ]; then
              echo "FAIL: action succeeded but sarif output is empty"
              exit 1
            fi
            if [ ! -f "$SARIF" ]; then
              echo "FAIL: sarif file does not exist at path: $SARIF"
              exit 1
            fi
            echo "PASS: sarif file found at $SARIF"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (acceptable in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
