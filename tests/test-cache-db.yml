name: Test cache-db input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal path to scan
        run: |
          mkdir -p /tmp/scan-target
          echo "FROM scratch" > /tmp/scan-target/Dockerfile
      - id: action
        uses: .
        with:
          path: /tmp/scan-target
          cache-db: "true"
          output-format: json
          fail-build: "false"
          severity-cutoff: critical
        continue-on-error: true
      - name: Assert action ran with cache-db input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          JSON_OUT: ${{ steps.action.outputs.json }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json output: $JSON_OUT"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with cache-db input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (may fail on sentinel repo or network) but cache-db input was accepted"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
