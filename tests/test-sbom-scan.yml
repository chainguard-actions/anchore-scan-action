name: Test SBOM scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal CycloneDX SBOM file
        run: |
          cat > /tmp/test-sbom.json << 'EOF'
          {
            "bomFormat": "CycloneDX",
            "specVersion": "1.4",
            "version": 1,
            "serialNumber": "urn:uuid:test-1234",
            "metadata": {
              "timestamp": "2024-01-01T00:00:00Z",
              "component": {
                "type": "application",
                "name": "test-app",
                "version": "1.0.0"
              }
            },
            "components": [
              {
                "type": "library",
                "name": "openssl",
                "version": "1.1.1",
                "purl": "pkg:deb/debian/openssl@1.1.1?arch=amd64"
              }
            ]
          }
          EOF
      - id: scan
        uses: .
        with:
          sbom: "/tmp/test-sbom.json"
          fail-build: "false"
          severity-cutoff: "critical"
          output-format: "sarif"
        continue-on-error: true
      - name: Assert SBOM scan ran
        env:
          OUTCOME: ${{ steps.scan.outcome }}
          SARIF: ${{ steps.scan.outputs.sarif }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sarif output path: $SARIF"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$SARIF" ]; then
              echo "FAIL: scan succeeded but sarif output path is empty"
              exit 1
            fi
            if [ ! -f "$SARIF" ]; then
              echo "FAIL: sarif file does not exist at $SARIF"
              exit 1
            fi
            echo "PASS: sarif file found at $SARIF"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: scan step failed gracefully (acceptable in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
