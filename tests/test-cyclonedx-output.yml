name: Test CycloneDX output format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: scan
        uses: .
        with:
          path: "."
          fail-build: "false"
          severity-cutoff: "critical"
          output-format: "cyclonedx"
        continue-on-error: true
      - name: Assert scan produced CycloneDX XML output
        env:
          OUTCOME: ${{ steps.scan.outcome }}
          CDX_XML: ${{ steps.scan.outputs.cyclonedx-xml }}
        run: |
          echo "outcome: $OUTCOME"
          echo "cyclonedx-xml output path: $CDX_XML"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CDX_XML" ]; then
              echo "FAIL: scan succeeded but cyclonedx-xml output path is empty"
              exit 1
            fi
            if [ ! -f "$CDX_XML" ]; then
              echo "FAIL: cyclonedx-xml file does not exist at $CDX_XML"
              exit 1
            fi
            echo "PASS: CycloneDX XML file found at $CDX_XML"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: scan step failed gracefully (acceptable in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
