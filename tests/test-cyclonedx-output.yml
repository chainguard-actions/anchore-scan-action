name: Test CycloneDX output format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          path: "."
          fail-build: "false"
          output-format: "cyclonedx"
          severity-cutoff: "critical"
        continue-on-error: true

      - name: Assert CycloneDX output produced
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CYCLONEDX_XML_OUT: ${{ steps.action.outputs.cyclonedx-xml }}
        run: |
          echo "outcome: $OUTCOME"
          echo "cyclonedx-xml output: $CYCLONEDX_XML_OUT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CYCLONEDX_XML_OUT" ]; then
              echo "FAIL: action succeeded but cyclonedx-xml output is empty"
              exit 1
            fi
            if [ ! -f "$CYCLONEDX_XML_OUT" ]; then
              echo "FAIL: cyclonedx-xml output file does not exist at $CYCLONEDX_XML_OUT"
              exit 1
            fi
            echo "PASS: CycloneDX XML output file found at $CYCLONEDX_XML_OUT"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (acceptable in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
