name: Test invalid severity-cutoff fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          path: "."
          fail-build: "false"
          output-format: "sarif"
          severity-cutoff: "invalid-severity"
        continue-on-error: true

      - name: Assert action fails with invalid severity
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed with invalid severity-cutoff"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed with invalid severity-cutoff but succeeded"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
