name: Test fail-build false does not fail on vulnerabilities
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          path: "."
          output-format: "sarif"
          fail-build: "false"
          severity-cutoff: "negligible"

      - name: Assert action succeeded with fail-build false
        run: |
          echo "Action completed successfully with fail-build=false"
          echo "PASS: action did not fail even with severity-cutoff=negligible"

      - name: Assert sarif output is set
        env:
          SARIF_PATH: ${{ steps.action.outputs.sarif }}
        run: |
          echo "sarif output path: $SARIF_PATH"
          if [ -z "$SARIF_PATH" ]; then
            echo "FAIL: sarif output is empty"
            exit 1
          fi
          echo "PASS: sarif output is set to '$SARIF_PATH'"

      - name: Assert sarif file exists
        env:
          SARIF_PATH: ${{ steps.action.outputs.sarif }}
        run: |
          if [ ! -f "$SARIF_PATH" ]; then
            echo "FAIL: sarif file does not exist at '$SARIF_PATH'"
            exit 1
          fi
          echo "PASS: sarif file exists at '$SARIF_PATH'"
