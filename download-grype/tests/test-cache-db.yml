name: Test Grype download with cache-db enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          cache-db: "true"
      - name: Assert cmd output is set
        env:
          CMD: ${{ steps.action.outputs.cmd }}
        run: |
          echo "cmd: $CMD"
          if [ -z "$CMD" ]; then
            echo "FAIL: cmd output is empty"
            exit 1
          fi
          echo "PASS: cmd output is set to '$CMD'"
      - name: Assert cmd is executable
        env:
          CMD: ${{ steps.action.outputs.cmd }}
        run: |
          echo "Checking if '$CMD' is executable..."
          if [ ! -x "$CMD" ]; then
            echo "FAIL: '$CMD' is not executable or does not exist"
            exit 1
          fi
          echo "PASS: '$CMD' is executable"
      - name: Assert Grype runs successfully with cache-db enabled
        env:
          CMD: ${{ steps.action.outputs.cmd }}
        run: |
          echo "Running: $CMD version"
          "$CMD" version
          if [ $? -ne 0 ]; then
            echo "FAIL: grype version command failed"
            exit 1
          fi
          echo "PASS: grype ran successfully with cache-db enabled"
