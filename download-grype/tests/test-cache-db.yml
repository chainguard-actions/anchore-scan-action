name: Test download-grype with cache-db enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          run: download-grype
          cache-db: "true"
      - name: Assert cmd output is set
        env:
          CMD: ${{ steps.action.outputs.cmd }}
        run: |
          echo "cmd: $CMD"
          if [ -z "$CMD" ]; then
            echo "FAIL: expected cmd output to be set"
            exit 1
          fi
          echo "PASS: cmd output is set to $CMD"
      - name: Assert grype binary is executable
        env:
          CMD: ${{ steps.action.outputs.cmd }}
        run: |
          echo "checking binary at: $CMD"
          if [ ! -f "$CMD" ]; then
            echo "FAIL: grype binary not found at $CMD"
            exit 1
          fi
          if [ ! -x "$CMD" ]; then
            echo "FAIL: grype binary is not executable at $CMD"
            exit 1
          fi
          echo "PASS: grype binary exists and is executable"
      - name: Assert grype runs successfully with cache-db enabled
        env:
          CMD: ${{ steps.action.outputs.cmd }}
        run: |
          echo "running: $CMD version"
          "$CMD" version
          echo "PASS: grype version ran successfully with cache-db enabled"
