name: Test specific Grype version download
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          grype-version: "v0.79.4"
      - name: Assert cmd output is set
        env:
          CMD: ${{ steps.action.outputs.cmd }}
        run: |
          echo "cmd: $CMD"
          if [ -z "$CMD" ]; then
            echo "FAIL: cmd output is empty"
            exit 1
          fi
          echo "PASS: cmd output is set to '$CMD'"
      - name: Assert cmd is executable
        env:
          CMD: ${{ steps.action.outputs.cmd }}
        run: |
          echo "Checking if '$CMD' is executable..."
          if [ ! -x "$CMD" ]; then
            echo "FAIL: '$CMD' is not executable or does not exist"
            exit 1
          fi
          echo "PASS: '$CMD' is executable"
      - name: Assert Grype version matches requested version
        env:
          CMD: ${{ steps.action.outputs.cmd }}
          EXPECTED_VERSION: "0.79.4"
        run: |
          echo "Running: $CMD version"
          VERSION_OUTPUT="$("$CMD" version)"
          echo "Version output: $VERSION_OUTPUT"
          if ! echo "$VERSION_OUTPUT" | grep -q "$EXPECTED_VERSION"; then
            echo "FAIL: expected version '$EXPECTED_VERSION' not found in output"
            exit 1
          fi
          echo "PASS: grype version '$EXPECTED_VERSION' confirmed"
